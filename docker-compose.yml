services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: marketlens-postgres
    environment:
      POSTGRES_DB: marketlens
      POSTGRES_USER: marketlens
      POSTGRES_PASSWORD: marketlens_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/schema_extensions.sql:/docker-entrypoint-initdb.d/02_schema_extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketlens -d marketlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: marketlens-backend
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: marketlens
      POSTGRES_USER: marketlens
      POSTGRES_PASSWORD: marketlens_dev
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python scripts/etl/load_data.py &&
             python -m backend.app.ml.pipeline &&
             python -m backend.app.rag &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marketlens-frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
